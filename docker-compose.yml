services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darksuite
      POSTGRES_PASSWORD: darksuite
      POSTGRES_DB: darksuite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darksuite"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://darksuite:darksuite@postgres:5432/darksuite
      PORT: 4000
      HOST: 0.0.0.0
      ONLYCREATOR_API_URL: http://host.docker.internal:3001
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4124:80"

volumes:
  pgdata:
